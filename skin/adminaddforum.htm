<div class="card forum-form-card mb-4">
    <div class="forum-head-bar"><a href="{$forumhome}">{$forumtitle}</a> <span class="text-muted mx-1">/</span> {$lang['add_forum']}</div>
    <div class="card-body">
        <form action="{$adminfile}?a=addforum" method="post" class="formstyle">
            <div class="form-group"><label for="parent-forum">{$lang['parent_cat']}</label><div id="parent-forum">{$parentselect}</div></div>
            <div class="form-group"><label for="forum-name">{$lang['forum_name']}</label><input class="form-control" id="forum-name" type="text" name="forumname" maxlength="100" value="{$forumname}"></div>
            <div class="form-group"><label for="forum-description">{$lang['forum_desc']}</label><textarea class="form-control" id="forum-description" name="forumdesc" rows="5">{$forumdesc}</textarea></div>
            <button class="btn btn-primary" type="submit" name="addforum" value="{$lang['add_forum']}">{$lang['add_forum']}</button>
        </form>
    </div>
</div>
