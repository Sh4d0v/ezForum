<div class="card forum-form-card mb-4">
    <div class="forum-head-bar"><a href="{$forumhome}">{$forumtitle}</a> <span class="text-muted mx-1">/</span> {$ban_title}</div>
    <div class="card-body">
        <form action="{$adminfile}?a={$ban_operation}" method="post" class="formstyle">
            <div class="form-group"><label for="ban-value">{$lang['user_ip_email']}</label><input class="form-control" id="ban-value" type="text" name="uie" value="{$uie}"><small class="form-text text-muted">{$ban_help}</small></div>
            <button class="btn btn-primary" type="submit" name="{$ban_operation}" value="{$ban_title}">{$ban_title}</button>
        </form>
    </div>
</div>
