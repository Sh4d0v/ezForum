<table class="posttable" cellspacing="0" width="100%" border="0">
    <tr>
        <td class="posttitle" colspan="2">
            {$posted_on} {$user_ip} {$edited_by}
            <span style="float: right;">{$post_actions}</span>
        </td>
    </tr>
    <tr>
        <td valign="top" class="postauthor" width="150">
            <div>{$author_avatar}</div>
            <div><strong>{$posted_by} {$author_online}</strong></div>
            <div>{$user_type}</div>
            <div>{$author_num_posts}</div>
            <div>{$author_gold}</div>
            <div>{$author_reg_date}</div>
        </td>
        <td valign="top" class="posttext">
            {$post_message}
        </td>
    </tr>
</table>
