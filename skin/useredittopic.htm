{$errormessage}
<div class="card forum-form-card mb-4">
    <div class="forum-head-bar"><a href="{$forumhome}">{$forumtitle}</a> <span class="text-muted mx-1">/</span> {$lang['edit_topic']}</div>
    <div class="card-body">
        <form action="{$forumscript}?a=edittopic&amp;t={$t}" method="post" name="eform" class="formstyle">
            <div class="form-group">
                <label for="topic-title">{$lang['topic_title']}</label>
                <input class="form-control" id="topic-title" name="newtitle" type="text" maxlength="100" value="{$topic_title}">
            </div>
            <button class="btn btn-primary" type="submit" name="submit" value="{$lang['edit_topic']}">{$lang['edit_topic']}</button>
        </form>
    </div>
</div>
