{$errormessage}
<div class="card forum-form-card mb-4">
    <div class="forum-head-bar"><a href="{$forumhome}">{$forumtitle}</a> <span class="text-muted mx-1">/</span> {$lang['move_topic']}</div>
    <div class="card-body">
        <form action="{$forumscript}?a=movetopic&amp;t={$t}" method="post" name="mform" class="formstyle">
            <div class="form-group">
                <label for="move-topic">{$lang['move_topic']} "$topic_title"</label>
                <div id="move-topic">{$forums_select}</div>
            </div>
            <button class="btn btn-primary" type="submit" name="submit" value="{$lang['move_topic']}">{$lang['move_topic']}</button>
        </form>
    </div>
</div>
