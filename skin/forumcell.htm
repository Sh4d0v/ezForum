<tr class=forumrow{$cell_iterator} align="center">
    <td class="forumcell" width="2%">
        <div class="lead">✉️</div>
    </td>
    <td class="forumcell" align="left">
        <b>{$forum_link}</b>
        <div>
            <span class="forumdesc">{$forum_desc}</span>
            <div class="text-muted font-italic">{$moderated_by}</div>
            {$subforums}
        </div>
    </td>
    <td class="forumcell">
        {$num_topics}
    </td>
    <td class="forumcell">
        {$num_replies}
    </td>
    <td class="forumcell">
        {$lastpost}
    </td>
</tr>
